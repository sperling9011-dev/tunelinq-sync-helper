<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Longfill Rechner</title>
<style>
:root{
    --bg:#eef4fb;
    --card:#ffffff;
    --text:#222222;
    --line:#d5dbe5;

    --b2:#d9ecff;
    --b1:#dff7df;

    --res:#f7f7f7;
}

body.dark{
    --bg:#121821;
    --card:#1d2633;
    --text:#eef2f7;
    --line:#3d4b61;

    /* Base-Karten */
    --b2:#223850;
    --b1:#233d2b;

    /* Ergebnisfelder */
    --res:#2b3443;
}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 3px 10px #0002;margin-top:16px}
h2{margin:0 0 12px}
h3{margin:0 0 12px;font-size:1.1em}
h4{margin:16px 0 8px;font-size:0.95em}
.row{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center;margin:8px 0}
input,select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.box{padding:12px;border-radius:10px}.b1{background:var(--b1)}.b2{background:var(--b2)}
.res{background:var(--res);padding:10px;border-radius:8px;margin-top:8px}
.err{color:#d33;min-height:1.2em}
button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:6px}
th,td{border:1px solid var(--line);padding:8px;text-align:center;font-size:0.9em}
th{background:var(--res)}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><div class=wrap>
<div style="display:flex;justify-content:space-between;align-items:center"><h2>🧪 Longfill-Rechner</h2><button onclick="document.body.classList.toggle('dark')">🌙</button></div>
<div class=card>
<div class=row><label><b>Gebindegröße</b></label><select id=v><option>60 ml</option><option>100 ml</option><option selected>120 ml</option></select></div>
<div class=row><label><b>Aromainhalt (ml)</b></label><input id=a></div>
<div class=row><label><b>Soll-Nikotin (mg/ml)</b></label><input id=s></div>
<div class=grid>
<div class="box b1"><b>Base 1</b><div class=row><label>mg/ml</label><input id=n1 value="100"></div><div id=o1 class=res>—</div></div>
<div class="box b2"><b>Base 2</b><div class=row><label>mg/ml</label><input id=n2 value="0"></div><div id=o2 class=res>—</div></div>
</div><div id=e class=err></div></div>

<div class=card>
<h3>Richtwerte bei 10 ml Aroma</h3>
<h4>20 mg/ml Endprodukt mit 100 mg-Base und VPG</h4>
<table><tr><th>Flaschengröße (ml)</th><th>100 mg Base (ml)</th></tr><tr><td>60</td><td>12</td></tr><tr><td>100</td><td>20</td></tr><tr><td>120</td><td>24</td></tr></table>
<h4>20-21 mg/ml Endprodukt mit 20 mg-Base und 100 mg-Base</h4>
<table><tr><th>Flaschengröße (ml)</th><th>20 mg Base (ml)</th><th>100 mg Base (ml)</th></tr><tr><td>60</td><td>47</td><td>3</td></tr><tr><td>100</td><td>87</td><td>3</td></tr><tr><td>120</td><td>106</td><td>4</td></tr></table>
</div>
</div>
<script>
function g(i){return parseFloat(document.getElementById(i).value.replace(",", "."))}
function calc(){
e.textContent="";
let V=g("v"),A=g("a"),S=g("s"),N1=g("n1"),N2=g("n2");
if([A,S,N1,N2].some(isNaN)){o1.textContent="Bitte Werte eingeben";o2.textContent="";return;}
if(A>V){e.textContent="Aroma darf nicht größer als Gebinde sein.";return;}
if(N1===N2){e.textContent="Base 1 und Base 2 dürfen nicht gleich sein.";return;}
let b1=(V*S-(V-A)*N2)/(N1-N2),b2=(V-A)-b1;
if(b1<0||b2<0){e.textContent="Mit diesen Werten ist keine gültige Mischung möglich.";return;}
o1.textContent=`${b1.toFixed(2)} ml`;
o2.textContent=`${b2.toFixed(2)} ml`;
}
document.querySelectorAll("input,select").forEach(x=>x.oninput=calc);calc();
</script></body></html>-
